<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Card Vault">
<title>My Card Vault</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#111827}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:22px 16px 90px}.brand{font-size:28px;font-weight:850;letter-spacing:-.6px}.sub{color:#6b7280;font-size:13px;margin-top:2px}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0 16px}.nav button{border:0;background:#fff;padding:10px 14px;border-radius:12px;white-space:nowrap;box-shadow:0 1px 5px #0000000b}.nav button.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 8px #0000000a}.stat b{font-size:23px;display:block;margin-top:4px}.label{font-size:12px;color:#6b7280}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 2px 8px #0000000a}.panel h2,.panel h3{margin:0 0 8px}.muted{color:#6b7280}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:#111827;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:750}.secondary{background:#eef0f4;color:#111827;border:0;border-radius:12px;padding:11px 15px}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:12px;padding:11px 15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid #d8dce3;border-radius:11px;background:#fff}.toolbar input{flex:1;min-width:190px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #eef0f4;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0000000a;transition:.15s}.card:hover{box-shadow:0 5px 18px #00000014;transform:translateY(-1px)}.photo{aspect-ratio:3/4;background:#e8ebf0;display:flex;align-items:center;justify-content:center;color:#9ca3af;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.body strong{display:block;font-size:15px}.body span{display:block;font-size:12px;color:#6b7280;margin-top:3px}.pill{display:inline-block!important;width:max-content;background:#eef0f4;color:#374151!important;border-radius:999px;padding:4px 8px;font-size:11px!important;margin-top:7px}.card-actions{display:flex;gap:6px;margin-top:10px}.small{padding:8px 10px;font-size:12px}.open-card{width:100%;background:#111827;color:#fff;border:0;border-radius:10px;padding:9px;font-weight:750}.empty{text-align:center;padding:48px 10px;color:#6b7280}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8dce3;border-radius:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.sell-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}.thumb{width:70px;height:85px;background:#e8ebf0;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:11px}.thumb img{width:100%;height:100%;object-fit:cover}.sell-row:last-child{border-bottom:0}.modal-wrap{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.modal-top{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef0f4;border-radius:50%;width:36px;height:36px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0}.detail-photo{aspect-ratio:3/4;border-radius:12px;background:#e8ebf0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#9ca3af}.detail-photo img{width:100%;height:100%;object-fit:contain}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:#f7f8fa;border-radius:10px;padding:9px}.kv small{display:block;color:#6b7280;font-size:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;z-index:50;box-shadow:0 4px 18px #0003}
@media(max-width:800px){.grid,.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:16px 13px 80px}.brand{font-size:24px}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.cards{gap:10px}.modal{padding:16px}}
</style></head><body><div id="app"></div>
<script>
const KEY='my-card-vault-v2';let cards=[];try{cards=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){cards=[]}let view='dashboard',editingId=null,detailId=null;
const money=n=>n===null||n===undefined||n===''?'—':`$${Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;const val=n=>n===null||n===undefined||n===''?null:Number(n);
function save(){localStorage.setItem(KEY,JSON.stringify(cards))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function nav(){return `<div class="nav">${[['dashboard','📊 Dashboard'],['collection','🃏 Collection'],['sell','💰 What Should I Sell?'],['add','➕ Add Card']].map(([x,t])=>`<button class="${view===x?'active':''}" onclick="go('${x}')">${t}</button>`).join('')}</div>`}
function app(){document.getElementById('app').innerHTML=`<main class="shell"><div><div class="brand">🃏 My Card Vault</div><div class="sub">Your private collection tracker</div></div>${nav()}${view==='dashboard'?dashboard():view==='collection'?collection():view==='sell'?sell():addForm()}</main>${detailId?detailModal():''}`}
function dashboard(){const known=cards.filter(c=>val(c.cost)!==null),invested=known.reduce((a,c)=>a+val(c.cost),0),value=cards.reduce((a,c)=>a+(val(c.value)||0),0),sellCards=cards.filter(c=>c.status==='Sell'),potential=sellCards.reduce((a,c)=>a+(val(c.value)||0),0),sold=cards.filter(c=>val(c.salePrice)!==null),profit=sold.reduce((a,c)=>a+profitFor(c),0);return `<div class="grid"><div class="stat"><span class="label">Total Cards</span><b>${cards.length}</b></div><div class="stat"><span class="label">Estimated Value</span><b>${money(value)}</b></div><div class="stat"><span class="label">Known Invested</span><b>${money(invested)}</b></div><div class="stat"><span class="label">Unknown Cost</span><b>${cards.length-known.length}</b></div></div><div class="grid" style="margin-top:12px"><div class="stat"><span class="label">Potential Sell Value</span><b>${money(potential)}</b></div><div class="stat"><span class="label">Cards to Sell</span><b>${sellCards.length}</b></div><div class="stat"><span class="label">Realized Profit</span><b>${money(profit)}</b></div><div class="stat"><span class="label">Sold Cards</span><b>${sold.length}</b></div></div><div class="panel"><h2>Welcome to My Card Vault</h2><p class="muted">Add cards as you acquire them. Older cards can have an <b>Unknown</b> acquisition cost without messing up your ROI.</p><div class="actions"><button class="primary" onclick="go('add')">➕ Add Card</button><button class="secondary" onclick="go('collection')">View Collection</button><button class="secondary" onclick="go('sell')">💰 What Should I Sell?</button></div></div>`}
function collection(){return `<div class="panel"><div class="toolbar"><input id="search" placeholder="Search player, set, parallel..." oninput="renderCollection()"><select id="statusFilter" onchange="renderCollection()"><option value="">All Statuses</option><option>Keep</option><option>Sell</option><option>Undecided</option></select><select id="viaFilter" onchange="renderCollection()"><option value="">All Sources</option><option>Break</option><option>Box</option><option>Purchase</option><option>Trade</option><option>Gift</option><option>Unknown</option></select></div><div id="collectionArea"></div></div>`}
function renderCollection(){const q=(document.getElementById('search')?.value||'').toLowerCase(),s=document.getElementById('statusFilter')?.value||'',v=document.getElementById('viaFilter')?.value||'';let arr=cards.filter(c=>!q||[c.player,c.sport,c.year,c.set,c.parallel,c.serial].join(' ').toLowerCase().includes(q)).filter(c=>!s||c.status===s).filter(c=>!v||c.via===v);document.getElementById('collectionArea').innerHTML=arr.length?`<div class="cards">${arr.map(cardTile).join('')}</div>`:`<div class="empty">${cards.length?'No cards match those filters.':'Your vault is empty — let’s fix that. 😏'}</div>`}
function cardTile(c){return `<div class="card"><div class="photo" onclick="openDetail('${c.id}')">${c.front?`<img src="${c.front}" alt="">`:'No photo'}</div><div class="body"><strong>${esc(c.player||'Unknown Player')}</strong><span>${esc([c.year,c.set].filter(Boolean).join(' • ')||'Details not entered')}</span>${c.parallel?`<span>${esc(c.parallel)}${c.serial?' • '+esc(c.serial):''}</span>`:''}<span class="pill">${esc(c.status||'Undecided')}</span><div style="margin-top:8px;font-weight:750">${money(c.value)}</div><div class="card-actions"><button class="open-card" onclick="openDetail('${c.id}')">Open Card</button><button class="secondary small" onclick="editCard('${c.id}')">Edit</button></div></div></div>`}
function sell(){const arr=cards.filter(c=>c.status==='Sell');return `<div class="panel"><h2>What Should I Sell?</h2><p class="muted">Cards you've marked <b>Sell</b> appear here.</p>${arr.length?arr.map(c=>`<div class="sell-row"><div class="thumb">${c.front?`<img src="${c.front}">`:'No photo'}</div><div><b>${esc(c.player||'Unknown Player')}</b><div class="muted">${esc(c.parallel||c.set||'')}</div><div>Estimated value: <b>${money(c.value)}</b></div></div><button class="secondary small" onclick="openDetail('${c.id}')">Open</button></div>`).join(''):'<div class="empty">Nothing marked for sale yet.</div>'}</div>`}
function addForm(){const c=editingId?cards.find(x=>x.id===editingId):null;return `<div class="panel"><h2>${c?'Edit Card':'Add Card'}</h2><form class="form" onsubmit="saveCard(event)"><div class="field"><label>Player</label><input name="player" value="${esc(c?.player||'')}" placeholder="e.g. Matheus Cunha"></div><div class="field"><label>Sport</label><input name="sport" value="${esc(c?.sport||'')}" placeholder="Soccer"></div><div class="field"><label>Year</label><input name="year" value="${esc(c?.year||'')}" placeholder="2025/26"></div><div class="field"><label>Set</label><input name="set" value="${esc(c?.set||'')}" placeholder="Futera Unique World Football"></div><div class="field"><label>Parallel / Insert</label><input name="parallel" value="${esc(c?.parallel||'')}" placeholder="Gold Frame /3"></div><div class="field"><label>Serial Number</label><input name="serial" value="${esc(c?.serial||'')}" placeholder="3/3"></div><div class="field"><label>Acquired Via</label><select name="via">${['Break','Box','Purchase','Trade','Gift','Unknown'].map(x=>`<option ${c?.via===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>What You Paid <span class="muted">(optional)</span></label><input name="cost" type="number" step="0.01" min="0" value="${c?.cost??''}" placeholder="Leave blank if unknown"></div><div class="field"><label>Estimated Current Value</label><input name="value" type="number" step="0.01" min="0" value="${c?.value??''}" placeholder="Optional"></div><div class="field"><label>Status</label><select name="status">${['Keep','Sell','Undecided'].map(x=>`<option ${c?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Sale Price <span class="muted">(if sold)</span></label><input name="salePrice" type="number" step="0.01" min="0" value="${c?.salePrice??''}" placeholder="Optional"></div><div class="field"><label>Selling Fees</label><input name="fees" type="number" step="0.01" min="0" value="${c?.fees??''}" placeholder="Optional"></div><div class="field"><label>Shipping Cost</label><input name="shipping" type="number" step="0.01" min="0" value="${c?.shipping??''}" placeholder="Optional"></div><div class="field full"><label>Notes</label><textarea name="notes" placeholder="Anything you want to remember...">${esc(c?.notes||'')}</textarea></div><div class="field full"><label>Front Photo</label><input name="front" type="file" accept="image/*"></div><div class="field full"><label>Back Photo</label><input name="back" type="file" accept="image/*"></div><div class="full actions"><button class="primary">${c?'Save Changes':'Save Card'}</button><button type="button" class="secondary" onclick="go('collection')">Cancel</button>${c?`<button type="button" class="danger" onclick="deleteCard('${c.id}')">Delete</button>`:''}</div></form></div>`}
function fileData(f){return new Promise(r=>{if(!f||!f.size)return r('');const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/img.width),w=Math.round(img.width*scale),h=Math.round(img.height*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);r(cv.toDataURL('image/jpeg',.82))};img.src=rd.result};rd.readAsDataURL(f)})}
async function saveCard(e){e.preventDefault();const f=new FormData(e.target);let c=editingId?cards.find(x=>x.id===editingId)||{}:{id:id(),createdAt:new Date().toISOString()};for(const k of ['player','sport','year','set','parallel','serial','via','status','notes'])c[k]=f.get(k)||'';for(const k of ['cost','value','salePrice','fees','shipping'])c[k]=f.get(k)===''?'':Number(f.get(k));const front=await fileData(f.get('front')),back=await fileData(f.get('back'));if(front)c.front=front;if(back)c.back=back;if(!editingId)cards.unshift(c);save();editingId=null;view='collection';app();setTimeout(renderCollection,0);toast('Card saved 🃏')}
function editCard(i){editingId=i;view='add';app()}function deleteCard(i){if(!confirm('Delete this card from My Card Vault?'))return;cards=cards.filter(c=>c.id!==i);save();detailId=null;editingId=null;view='collection';app();setTimeout(renderCollection,0);toast('Card deleted')}
function profitFor(c){const sale=val(c.salePrice);if(sale===null)return 0;const fees=val(c.fees)||0,ship=val(c.shipping)||0,cost=val(c.cost);return sale-fees-ship-(cost===null?0:cost)}
function detailModal(){const c=cards.find(x=>x.id===detailId);if(!c)return '';return `<div class="modal-wrap" onclick="if(event.target===this)closeDetail()"><div class="modal"><div class="modal-top"><div><h2 style="margin:0">${esc(c.player||'Unknown Player')}</h2><div class="muted">${esc([c.year,c.set].filter(Boolean).join(' • '))}</div></div><button class="close" onclick="closeDetail()">✕</button></div><div class="detail-grid"><div class="detail-photo">${c.front?`<img src="${c.front}" alt="Front">`:'No front photo'}</div><div class="detail-photo">${c.back?`<img src="${c.back}" alt="Back">`:'No back photo'}</div></div><div class="kv"><div><small>Parallel</small>${esc(c.parallel||'—')}</div><div><small>Serial</small>${esc(c.serial||'—')}</div><div><small>Acquired Via</small>${esc(c.via||'—')}</div><div><small>What You Paid</small>${money(c.cost)}</div><div><small>Estimated Value</small>${money(c.value)}</div><div><small>Status</small>${esc(c.status||'Undecided')}</div><div><small>Sale Price</small>${money(c.salePrice)}</div><div><small>Profit</small>${val(c.salePrice)!==null?money(profitFor(c)):'—'}</div></div>${c.notes?`<div class="panel" style="margin-top:12px;background:#f7f8fa;box-shadow:none"><b>Notes</b><p style="white-space:pre-wrap">${esc(c.notes)}</p></div>`:''}<div class="actions" style="margin-top:14px"><button class="primary" onclick="closeDetail();editCard('${c.id}')">Edit</button><button class="danger" onclick="deleteCard('${c.id}')">Delete</button></div></div></div>`}
function openDetail(i){detailId=i;app()}function closeDetail(){detailId=null;app()}function go(v){view=v;editingId=null;detailId=null;app();if(v==='collection')setTimeout(renderCollection,0)}function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
app();if(view==='collection')renderCollection();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
